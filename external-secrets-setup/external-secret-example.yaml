# Example ExternalSecret configurations

# Example 1: Sync specific fields from AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-app-credentials
  namespace: default
spec:
  refreshInterval: 1h  # Sync every hour
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: aws-credentials  # Name of Kubernetes secret to create
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Custom template for credentials
        credentials: |
          [default]
          aws_access_key_id = {{ .access_key_id }}
          aws_secret_access_key = {{ .secret_access_key }}
          region = {{ .region }}
  data:
  - secretKey: access_key_id
    remoteRef:
      key: prod/app/aws-credentials
      property: access_key_id
  - secretKey: secret_access_key
    remoteRef:
      key: prod/app/aws-credentials
      property: secret_access_key
  - secretKey: region
    remoteRef:
      key: prod/app/aws-credentials
      property: region

---
# Example 2: Sync entire secret (all key-value pairs)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-config
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-config
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: prod/database/config  # Syncs all fields from this secret

---
# Example 3: Multiple secrets from different sources
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-config
  namespace: default
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
  - secretKey: api_key
    remoteRef:
      key: prod/app/api-keys
      property: external_api_key
  - secretKey: db_password
    remoteRef:
      key: prod/database/postgres
      property: password
  - secretKey: jwt_secret
    remoteRef:
      key: prod/app/jwt
      property: secret

---
# Example 4: Convert JSON secret to environment variables
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: json-to-env
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: env-vars
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_access_key }}"
        AWS_DEFAULT_REGION: "{{ .region }}"
        DATABASE_URL: "postgresql://{{ .db_user }}:{{ .db_password }}@{{ .db_host }}:5432/{{ .db_name }}"
  dataFrom:
  - extract:
      key: prod/app/full-config

---
# Example 5: With namespace-scoped SecretStore (not ClusterSecretStore)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: team-a-secrets
  namespace: team-a
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: team-a-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: team-a-credentials
  namespace: team-a
spec:
  refreshInterval: 2h
  secretStoreRef:
    name: team-a-secrets
    kind: SecretStore  # Note: SecretStore not ClusterSecretStore
  target:
    name: credentials
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: team-a/credentials

# External Secrets Operator Installation
# Syncs secrets from AWS Secrets Manager to Kubernetes

# Install using Helm (recommended)
# helm repo add external-secrets https://charts.external-secrets.io
# helm repo update
# helm install external-secrets external-secrets/external-secrets -n external-secrets-system --create-namespace

# Or apply this manifest for basic installation
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets-system
---
# SecretStore - Connects to AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        # Option 1: Use IRSA (Recommended)
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
        # Option 2: Use IAM Instance Profile
        # Uncomment below if using instance profile instead
        # secretRef:
        #   accessKeyID:
        #     name: awssm-secret
        #     key: access-key
        #   secretAccessKey:
        #     name: awssm-secret
        #     key: secret-access-key
---
# ClusterSecretStore - Available to all namespaces
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager-cluster
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets-system
---
# Service Account with IRSA annotation
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets-system
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/external-secrets-role
---
# ExternalSecret - Syncs specific secret from AWS
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-credentials-from-secretsmanager
  namespace: default
spec:
  refreshInterval: 1h  # Sync every hour
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: aws-credentials  # Kubernetes secret to create
    creationPolicy: Owner
  data:
  - secretKey: aws_access_key_id
    remoteRef:
      key: prod/app/aws-credentials  # Path in AWS Secrets Manager
      property: access_key_id
  - secretKey: aws_secret_access_key
    remoteRef:
      key: prod/app/aws-credentials
      property: secret_access_key
  - secretKey: aws_region
    remoteRef:
      key: prod/app/aws-credentials
      property: region
---
# Example: Sync entire secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: prod/database/postgres  # Syncs all key-value pairs

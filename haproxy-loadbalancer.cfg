# HAProxy configuration for Kubernetes HA control plane load balancer
# This runs on a separate instance (not part of the cluster)

global
    log /dev/log    local0
    log /dev/log    local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    # Security hardening
    maxconn 4096
    tune.ssl.default-dh-param 2048
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# Stats page
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats realm HAProxy\ Statistics
    stats auth admin:changeme
    stats refresh 30s

# Kubernetes API Server frontend (HTTPS)
frontend k8s-api-https
    bind *:6443
    mode tcp
    option tcplog
    default_backend k8s-api-backend

# Kubernetes API Server backend (both master nodes)
backend k8s-api-backend
    mode tcp
    balance roundrobin
    option tcp-check
    # Health check: TCP connect to port 6443
    tcp-check connect port 6443

    # Master node 1
    server master1 <MASTER1_PRIVATE_IP>:6443 check fall 3 rise 2

    # Master node 2
    server master2 <MASTER2_PRIVATE_IP>:6443 check fall 3 rise 2

# Optional: Frontend for HTTP traffic to worker nodes
frontend http-in
    bind *:80
    mode tcp
    option tcplog
    default_backend worker-nodes-http

# Optional: Frontend for HTTPS traffic to worker nodes
frontend https-in
    bind *:443
    mode tcp
    option tcplog
    default_backend worker-nodes-https

# Worker nodes HTTP backend
backend worker-nodes-http
    mode tcp
    balance roundrobin
    option tcp-check

    # Add all 5 worker nodes
    server worker1 <WORKER1_PRIVATE_IP>:80 check fall 3 rise 2
    server worker2 <WORKER2_PRIVATE_IP>:80 check fall 3 rise 2
    server worker3 <WORKER3_PRIVATE_IP>:80 check fall 3 rise 2
    server worker4 <WORKER4_PRIVATE_IP>:80 check fall 3 rise 2
    server worker5 <WORKER5_PRIVATE_IP>:80 check fall 3 rise 2

# Worker nodes HTTPS backend
backend worker-nodes-https
    mode tcp
    balance roundrobin
    option tcp-check

    # Add all 5 worker nodes
    server worker1 <WORKER1_PRIVATE_IP>:443 check fall 3 rise 2
    server worker2 <WORKER2_PRIVATE_IP>:443 check fall 3 rise 2
    server worker3 <WORKER3_PRIVATE_IP>:443 check fall 3 rise 2
    server worker4 <WORKER4_PRIVATE_IP>:443 check fall 3 rise 2
    server worker5 <WORKER5_PRIVATE_IP>:443 check fall 3 rise 2

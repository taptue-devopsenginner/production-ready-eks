apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-app-sa
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/my-app-role
---
apiVersion: v1
kind: Pod
metadata:
  name: my-app
  namespace: default
spec:
  serviceAccountName: my-app-sa
  containers:
  - name: app
    image: amazon/aws-cli:latest
    command:
      - sleep
      - "3600"
    env:
    - name: AWS_REGION
      value: us-east-1
    # AWS SDK will automatically use IRSA credentials
    # No AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY needed!
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      serviceAccountName: my-app-sa
      containers:
      - name: app
        image: your-app-image:latest
        env:
        - name: AWS_REGION
          value: us-east-1
        # IRSA automatically injects:
        # - AWS_ROLE_ARN
        # - AWS_WEB_IDENTITY_TOKEN_FILE
        # AWS SDKs use these automatically
